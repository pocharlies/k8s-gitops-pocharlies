apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bge
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/GitHub: https://github.com/pocharlies-org/k8s-ai-pocharlies
  labels:
    e-dani.com/tier: app
spec:
  project: default
  source:
    repoURL: https://github.com/pocharlies-org/k8s-ai-pocharlies
    # Rama, no SHA: el objetivo de SC-315 es que H3/H4 iteren los BGE sin repinear
    # el pin de la app `ai`. El re-pin de `ai` sigue reservado al operador.
    targetRevision: main
    path: k8s-bge
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
  # Las replicas las posee compute_mode.py (kubectl scale desde el selector del
  # dashboard). Sin esto, selfHeal revierte cada escala en segundos. Se listan los
  # 6 nombres aunque `bge-reranker` (GPU) no exista hoy como Deployment — inocuo,
  # y coincide con el ignoreDifferences de la app `ai`.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: bge-m3-embedding
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-m3-embedding-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-m3-embedding-creative
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker-cpu
      namespace: llm
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: bge-reranker-creative
      namespace: llm
      jsonPointers: ["/spec/replicas"]
